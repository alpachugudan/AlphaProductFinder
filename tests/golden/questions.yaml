# Golden dataset — Step 11 하드닝
# 각 case는 결정적 QuerySpec(oracle)과 평가 기대값을 담는다.
# Mock 모드는 query_spec을 직접 주입해 검색·판정·근거·답변 파이프라인을 검증하고,
# HyperCLOVA 모드는 동일 rubric으로 실제 intent 파싱·답변을 검증한다.

meta:
  dataset_version: 2026-07-11-baseline
  external_version: 2026-07-11-external-baseline
  schema_version: queryspec-1.0
  prompt_version_mock: mock-v1
  prompt_version_hyperclova: hcx-v1

cases:
  # --- 1. 단일 상품 이름/코드 조회 ---
  - id: G-001
    axis: single_product_lookup
    question: "iShares가 들어간 해외 ETF를 찾아줘"
    query_spec:
      version: "1.0"
      intent: LOOKUP_PRODUCT
      product_families: [ETF_GLOBAL]
      entities: []
      filters: [{field: product_name, operator: CONTAINS, value: "iShares"}]
      relationship_filters: []
      metrics: []
      preferences: []
      sort: []
      limit: 5
      as_of_requirement: SHOW_FIELD_DATE
      missing_policy: EXCLUDE_AND_DISCLOSE
    expect:
      intent: LOOKUP_PRODUCT
      families: [ETF_GLOBAL]
      decision: ANSWER
      min_candidates: 1

  - id: G-002
    axis: single_product_lookup
    question: "KODEX가 들어간 국내 ETF를 찾아줘"
    query_spec:
